version: '3.8'

services:
  api:
    build: .
    image: backend_emralerts:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - RELOAD_KEY=changeme
      # set MODEL_PATH to a mounted model file or folder inside the container
      - MODEL_PATH=/app/models/random_forest_pipeline.pkl
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
      - ./models:/app/models
      - ./:/app:ro
    command: uvicorn src.backend_emralerts.api.app:app --host 0.0.0.0 --port 8000 --log-level info
